name: Frontend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: trade-vault-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --webpack
        env:
          BACKEND_URL: http://backend:4001
      - run: npm audit --omit=dev --audit-level=high

  image:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/trade-vault-frontend.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      - run: gzip -9 /tmp/trade-vault-frontend.tar
      - uses: actions/upload-artifact@v7
        with:
          name: trade-vault-frontend-image
          path: /tmp/trade-vault-frontend.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trade-vault-frontend-image
          path: /tmp/trade-vault-image
      - name: Configure password-authenticated SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy immutable frontend image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: |
          sshpass -e scp -o PreferredAuthentications=password -o PubkeyAuthentication=no /tmp/trade-vault-image/trade-vault-frontend.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/trade-vault-frontend.tar.gz"
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; docker version >/dev/null; docker compose version >/dev/null; cd .trade-vault; test -f docker-compose.yml; gzip -dc /tmp/trade-vault-frontend.tar.gz | docker load; rm -f /tmp/trade-vault-frontend.tar.gz; touch images.env; (grep -v '^FRONTEND_IMAGE_TAG=' images.env || true) > images.env.tmp; printf 'FRONTEND_IMAGE_TAG=%s\n' '$IMAGE_TAG' >> images.env.tmp; mv images.env.tmp images.env; docker compose --env-file .env --env-file images.env pull edge certbot; docker compose --env-file .env --env-file images.env up -d --no-deps --wait --wait-timeout 120 frontend; if docker compose --env-file .env --env-file images.env run --rm --entrypoint sh certbot -c 'test -s /etc/letsencrypt/live/tradevault/fullchain.pem'; then docker compose --env-file .env --env-file images.env up -d --no-deps --wait --wait-timeout 120 edge; docker compose --env-file .env --env-file images.env run --rm certbot certonly --webroot --webroot-path=/var/www/certbot --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring --renew-with-new-domains --cert-name tradevault -d tradevaultnigeria.com -d www.tradevaultnigeria.com; docker compose --env-file .env --env-file images.env exec -T edge nginx -s reload; else docker compose --env-file .env --env-file images.env stop edge || true; docker compose --env-file .env --env-file images.env run --rm --publish 80:80 certbot certonly --standalone --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring --renew-with-new-domains --cert-name tradevault -d tradevaultnigeria.com -d www.tradevaultnigeria.com; docker compose --env-file .env --env-file images.env up -d --no-deps --wait --wait-timeout 120 edge; fi; docker compose --env-file .env --env-file images.env ps frontend edge"

  renew-certificate:
    if: github.event_name == 'schedule' && vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure password-authenticated SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Renew certificate without stopping Nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; cd .trade-vault; docker compose --env-file .env --env-file images.env pull certbot; docker compose --env-file .env --env-file images.env run --rm certbot certonly --webroot --webroot-path=/var/www/certbot --non-interactive --agree-tos --register-unsafely-without-email --keep-until-expiring --renew-with-new-domains --cert-name tradevault -d tradevaultnigeria.com -d www.tradevaultnigeria.com; docker compose --env-file .env --env-file images.env exec -T edge nginx -s reload"
